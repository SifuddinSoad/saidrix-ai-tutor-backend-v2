services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    networks: [dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.http.routers.livekit.rule=Host(`livekit.yourdomain.com`)
      - traefik.http.routers.livekit.entrypoints=websecure
      - traefik.http.routers.livekit.tls.certresolver=letsencrypt
      - traefik.http.services.livekit.loadbalancer.server.port=7880

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [dokploy-network]
    # no host port publish — only livekit talks to it internally

networks:
  dokploy-network:
    external: true